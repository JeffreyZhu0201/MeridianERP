services:
  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: meridian
      POSTGRES_PASSWORD: meridian
      POSTGRES_DB: meridian
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meridian"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - ../.env
    environment:
      DATABASE_URL: postgresql://meridian:meridian@postgres:5432/meridian
      REDIS_URL: redis://redis:6379
      API_PORT: "3001"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    profiles: [dev, prod]

  admin:
    build:
      context: ..
      dockerfile: apps/admin/Dockerfile
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy
    env_file:
      - ../.env
    environment:
      NEXT_PUBLIC_API_URL: http://api:3001
    profiles: [dev, prod]

  merchant:
    build:
      context: ..
      dockerfile: apps/merchant/Dockerfile
    ports:
      - "3002:3002"
    depends_on:
      api:
        condition: service_healthy
    env_file:
      - ../.env
    environment:
      NEXT_PUBLIC_API_URL: http://api:3001
      MERCHANT_APP_URL: http://localhost:3002
    profiles: [dev, prod]

  store:
    build:
      context: ..
      dockerfile: apps/store/Dockerfile
    ports:
      - "3003:3003"
    depends_on:
      api:
        condition: service_healthy
    env_file:
      - ../.env
    environment:
      NEXT_PUBLIC_API_URL: http://api:3001
      STORE_APP_URL: http://localhost:3003
    profiles: [dev, prod]

volumes:
  postgres_data:
