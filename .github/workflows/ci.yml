name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared packages
        run: pnpm --filter @meridian/shared build

      - name: Generate Prisma client
        run: pnpm --filter @meridian/api prisma:generate
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
          DIRECT_DATABASE_URL: postgresql://ci:ci@localhost:5432/ci

      - name: API e2e tests
        run: pnpm --filter @meridian/api test:e2e
        env:
          JWT_SECRET: test-jwt-secret
          JWT_MERCHANT_SECRET: test-merchant-jwt-secret
          JWT_STORE_SECRET: test-store-jwt-secret
          JWT_DISTRIBUTOR_SECRET: test-distributor-jwt-secret
          BIND_TOKEN_SECRET: test-bind-token-secret
          STRIPE_SECRET_KEY: sk_test_mock

      - name: Build all apps
        run: pnpm build
